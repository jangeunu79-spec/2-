name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compile Swift File to iOS Executable
      run: |
        mkdir -p Payload/ServerApp.app
        
        # 저장소의 .swift 파일을 찾아내어 iOS(arm64)용 바이트코드로 정식 컴파일
        SWIFT_FILE=$(ls *.swift | head -n 1)
        echo "Compiling $SWIFT_FILE for iOS..."
        
        swiftc -target arm64-apple-ios15.0 -sdk $(xcrun --sdk iphoneos --show-sdk-path) -o Payload/ServerApp.app/ServerApp "$SWIFT_FILE"
        
        # Info.plist 생성
        cat << 'EOF' > Payload/ServerApp.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleIdentifier</key>
            <string>com.example.serverapp</string>
            <key>CFBundleName</key>
            <string>ServerApp</string>
            <key>CFBundleExecutable</key>
            <string>ServerApp</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleVersion</key>
            <string>1.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>UIDeviceFamily</key>
            <array>
                <integer>1</integer>
            </array>
        </dict>
        </plist>
        EOF

        zip -r App.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Unsigned-IPA
        path: App.ipa
