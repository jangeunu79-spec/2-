name: Build Real iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compile for iOS (arm64)
      run: |
        # iOS 기기용 SDK 경로 확인 및 실제 컴파일
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        swift build -c release --triple arm64-apple-ios15.0 -Xswiftc -sdk -Xswiftc "$SDK_PATH" -Xcc -isysroot -Xcc "$SDK_PATH"
        
        # 앱 번들 생성 및 컴파일된 진짜 바이너리 복사
        mkdir -p Payload/ServerApp.app
        cp .build/arm64-apple-ios15.0/release/ServerApp Payload/ServerApp.app/ServerApp
        
        cat << 'EOF' > Payload/ServerApp.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleIdentifier</key>
            <string>com.example.serverapp</string>
            <key>CFBundleName</key>
            <string>ServerApp</string>
            <key>CFBundleExecutable</key>
            <string>ServerApp</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleVersion</key>
            <string>1.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>UIDeviceFamily</key>
            <array>
                <integer>1</integer>
            </array>
        </dict>
        </plist>
        EOF

        zip -r App.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Unsigned-IPA
        path: App.ipa
