name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Package Swift App into IPA
      run: |
        mkdir -p Payload/ServerApp.app
        
        # .swift 파일을 앱 실행 바이너리로 복사 후 권한 부여
        SWIFT_FILE=$(ls *.swift | head -n 1)
        echo "Found swift file: $SWIFT_FILE"
        cp "$SWIFT_FILE" Payload/ServerApp.app/ServerApp
        chmod +x Payload/ServerApp.app/ServerApp
        
        # Info.plist 생성
        cat << 'EOF' > Payload/ServerApp.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleIdentifier</key>
            <string>com.example.serverapp</string>
            <key>CFBundleName</key>
            <string>ServerApp</string>
            <key>CFBundleExecutable</key>
            <string>ServerApp</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleVersion</key>
            <string>1.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>UIDeviceFamily</key>
            <array>
                <integer>1</integer>
            </array>
        </dict>
        </plist>
        EOF

        zip -r App.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Unsigned-IPA
        path: App.ipa
